[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quill"
version = "0.1.0"
description = "Quick-Quotes Quill: meeting transcription, diarization and notes (API + worker)"
requires-python = ">=3.12"
license = "MIT"
# API + worker only. The diarizer (torch-cpu + NeMo) lives in its own venv (diarizer/).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pillow>=11",
    "numpy>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quill-worker = "quill.worker:main"

[tool.setuptools.packages.find]
include = ["quill*"]

[tool.setuptools.package-data]
"quill.pipeline" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
