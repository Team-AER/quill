# Quill site for the `web` container (see Dockerfile target `web` and compose.yaml).
# Same behaviour as nginx-quill.conf on a native install: static frontend from the
# published volume, everything under /api proxied to the `api` service.
# A TLS reverse proxy (e.g. NPMplus) forwards plain HTTP to port 80 of the host.

# Real client IPs come from X-Forwarded-For, trusted only from your reverse proxy;
# /etc/quill/nginx-real-ip.conf is bind-mounted from the host (see deploy/README.md).
include /etc/quill/nginx-real-ip.conf;

# Keep the scheme NPMplus saw (https) so the API builds correct tus Location URLs
# and secure cookies; fall back to our own scheme for direct LAN access.
map $http_x_forwarded_proto $quill_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Privacy: never log query strings (search terms can quote transcripts).
log_format quill_noquery '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

# Docker's embedded DNS; `resolve` follows the api container across restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream quill_api {
    zone quill_api 64k;
    server api:8020 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /dev/stdout quill_noquery;
    error_log  /dev/stderr warn;

    root /srv/www;
    index index.html;

    # tus chunks are 64 MiB; leave headroom. Never buffer bodies to disk.
    client_max_body_size 128m;
    client_body_timeout 3600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $quill_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # Server-sent events: no buffering, no caching, day-long idle reads.
    location = /api/events {
        proxy_pass http://quill_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # tus uploads: stream request bodies straight through to the API.
    location /api/uploads {
        proxy_pass http://quill_api;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://quill_api;
        proxy_request_buffering off;
        # Media range responses can be multi-GB; stream rather than spool to disk.
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite's content-hashed bundles never change under a given name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
